<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><title>MIY.MID Studio</title><style>:root{--bg:#0b0d12;--panel:#141821;--panel2:#1b202b;--line:#2c3442;--text:#f6f8fc;--muted:#a9b1bf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:920px;margin:auto;padding:16px 12px 96px}h1{font-size:25px;margin:0 0 6px}.sub{color:var(--muted);font-size:13px;margin-bottom:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0}h2{font-size:18px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media(max-width:700px){.grid,.grid3{grid-template-columns:1fr}}label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}select,input,button{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:11px 12px;font:inherit}button{cursor:pointer}.primary{background:#fff;color:#000;font-weight:800}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{width:auto;border-radius:999px;padding:8px 11px}.chip.active{background:#fff;color:#000;font-weight:800}.output,.note{background:#10141b;border:1px solid var(--line);border-radius:14px;padding:12px;white-space:pre-wrap;line-height:1.55}.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(11,13,18,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line)}.bottomInner{max-width:920px;margin:auto;padding:9px 12px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px}.bottomInner button{flex:1}</style></head><body><div class="wrap"><h1>MIY.MID Studio</h1><div class="sub">静止画＋静止画 → 動画演出。演出させる為のツール。</div><section class="card"><h2>クイック演出</h2><div id="quick" class="chips"></div></section><section class="card"><h2>1. 5秒の流れ</h2><div class="grid3"><div><label>初め</label><select id="begin"><option>すぐ動き始める</option><option>奥から現れる</option><option>左右から集まる</option><option>中央から広がる</option></select></div><div><label>中盤</label><select id="middle"><option>被写体を包む</option><option>手前へ迫る</option><option>崩壊する</option><option>再構築する</option><option>エフェクトを最大にする</option></select></div><div><label>終盤</label><select id="end"><option>発光して止まる</option><option>白フラッシュで終わる</option><option>奥へ消える</option><option>完成状態を残す</option></select></div></div></section><section class="card"><h2>2. エフェクト</h2><div id="effects" class="chips"></div><div style="height:10px"></div><div class="grid3"><div><label>量</label><select id="amount"><option>標準</option><option>多め</option><option>MAX</option></select></div><div><label>速度</label><select id="speed"><option>標準</option><option>速い</option><option>即発動</option></select></div><div><label>方向</label><select id="direction"><option>中央</option><option>奥から手前</option><option>全方向</option></select></div></div></section><section class="card"><h2>3. 見せ方</h2><div class="grid"><div><label>雰囲気</label><select id="mood"><option>シネマ風</option><option>派手</option><option>神秘的</option><option>近未来</option><option>壮大</option></select></div><div><label>強さ</label><select id="strength"><option>標準</option><option>強め</option><option>やりすぎ</option></select></div></div></section><section class="card"><details><summary>細かい設定</summary><div style="height:10px"></div><div class="grid"><div><label>二枚目</label><select id="secondImage"><option>使う</option><option>使わない</option></select></div><div><label>ループ</label><select id="loop"><option>しない</option><option>自然につなぐ</option></select></div></div></details></section><section class="card"><h2>英語プロンプト</h2><div id="output" class="output"></div></section></div><div class="bottom"><div class="bottomInner"><button id="generate" class="primary">生成</button><button id="copy">コピー</button></div></div><script>const FX=['粒子','発光','光線','エネルギーライン','グリッチ','残像','崩壊','再構築','煙・霧','火花・炎','フラッシュ','衝撃波','オーラ','電撃'];const PRE=[{n:'覚醒',fx:['発光','オーラ','エネルギーライン'],b:'すぐ動き始める',m:'被写体を包む',e:'発光して止まる',a:'多め',s:'速い',d:'中央',mo:'シネマ風',st:'強め'},{n:'爆発',fx:['フラッシュ','衝撃波','火花・炎'],b:'中央から広がる',m:'エフェクトを最大にする',e:'白フラッシュで終わる',a:'MAX',s:'即発動',d:'全方向',mo:'派手',st:'やりすぎ'},{n:'神秘',fx:['煙・霧','粒子','発光'],b:'奥から現れる',m:'被写体を包む',e:'奥へ消える',a:'標準',s:'標準',d:'中央',mo:'神秘的',st:'標準'},{n:'高速',fx:['残像','光線','エネルギーライン'],b:'奥から現れる',m:'手前へ迫る',e:'完成状態を残す',a:'多め',s:'速い',d:'奥から手前',mo:'近未来',st:'強め'}];const EN={'すぐ動き始める':'start moving immediately','奥から現れる':'emerge from depth','左右から集まる':'converge from both sides','中央から広がる':'expand from the center','被写体を包む':'wrap around the subject','手前へ迫る':'rush toward the camera','崩壊する':'break apart','再構築する':'rebuild','エフェクトを最大にする':'push effects to maximum intensity','発光して止まる':'hold on a glowing final frame','白フラッシュで終わる':'end on a white flash','奥へ消える':'fade into the distance','完成状態を残す':'hold the completed final state','粒子':'particles','発光':'glow','光線':'light rays','エネルギーライン':'energy trails','グリッチ':'glitch','残像':'afterimages','崩壊':'shattering','再構築':'reconstruction','煙・霧':'smoke and fog','火花・炎':'sparks and fire','フラッシュ':'flash','衝撃波':'shockwave','オーラ':'aura','電撃':'electric arcs','標準':'medium','多め':'heavy','MAX':'maximum','速い':'fast','即発動':'instant','中央':'centered','奥から手前':'from background toward foreground','全方向':'all directions','シネマ風':'cinematic','派手':'bold and flashy','神秘的':'mystical','近未来':'futuristic','壮大':'epic','強め':'strong','やりすぎ':'extreme'};const en=v=>EN[v]||v;function setFx(arr){document.querySelectorAll('[data-fx]').forEach(b=>b.classList.toggle('active',arr.includes(b.dataset.fx)))}function getFx(){return[...document.querySelectorAll('[data-fx].active')].map(b=>b.dataset.fx)}FX.forEach(x=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=x;b.dataset.fx=x;b.onclick=()=>b.classList.toggle('active');effects.appendChild(b)});PRE.forEach(p=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=p.n;b.onclick=()=>{setFx(p.fx);begin.value=p.b;middle.value=p.m;end.value=p.e;amount.value=p.a;speed.value=p.s;direction.value=p.d;mood.value=p.mo;strength.value=p.st};quick.appendChild(b)});function make(){const fx=getFx().map(en).join(', ')||'cinematic visual effects';const p=`Five-second cinematic sequence. Beginning: ${en(begin.value)}. Middle: ${en(middle.value)}. Ending: ${en(end.value)}. Visual effects: ${fx}. Effect amount: ${en(amount.value)}. Effect speed: ${en(speed.value)}. Effect direction: ${en(direction.value)}. Mood: ${en(mood.value)}. Intensity: ${en(strength.value)}. ${secondImage.value==='使う'?'Transition clearly from the first still image toward the second still image.':''} ${loop.value==='自然につなぐ'?'Finish in a way that can loop naturally.':''} Keep the motion immediate, the main payoff clear, and the ending visually readable.`;output.textContent=p;return p}generate.onclick=make;copy.onclick=async()=>navigator.clipboard.writeText(output.textContent||make());quick.children[0]?.click();</script></body></html>
